name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker buildx create --use
          docker buildx inspect --bootstrap

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build ARM64 app image and push
        run: |
          docker buildx build --platform linux/arm64/v8 \
            -t lmerta/filmino-app:latest \
            -f Dockerfile.app.prod \
            --push \
            .
        working-directory: ./app
         
      - name: Deploy files to Raspberry Pi
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./ mertalukas:/var/www/html/private/git/filmino

      - name: Create .env file on server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT_INT }}
          DB_URL: postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:${{ secrets.DB_PORT_INT }}/${{ secrets.DB_NAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_BASE_API_URL: ${{ secrets.NEXT_PUBLIC_BASE_API_URL }}
          NEXT_PUBLIC_BASE_HOST_URL: ${{ secrets.NEXT_PUBLIC_BASE_HOST_URL }}
          PGADMIN_DEFAULT_EMAIL: ${{ secrets.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_READ_KEY: ${{ secrets.TMDB_API_READ_KEY }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@mertalukas "cat > /var/www/html/private/git/filmino/app/.env <<EOL
          DB_HOST=${DB_HOST}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_NAME=${DB_NAME}
          DB_PORT=${DB_PORT}
          DB_URL=${DB_URL}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
          NEXT_PUBLIC_BASE_API_URL=${NEXT_PUBLIC_BASE_API_URL}
          NEXT_PUBLIC_BASE_HOST_URL=${NEXT_PUBLIC_BASE_HOST_URL}
          PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
          PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
          TMDB_API_KEY=${TMDB_API_KEY}
          TMDB_API_READ_KEY=${TMDB_API_READ_KEY}
          EOL"

      - name: Run make up-prod on Raspberry Pi
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@mertalukas "
            cd /var/www/html/private/git/filmino && make up-prod
          "
