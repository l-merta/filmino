name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install cloudflared
      run: |
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
        chmod +x cloudflared
        sudo mv cloudflared /usr/local/bin/

    - name: Create .ssh directory
      run: mkdir -p ~/.ssh

    - name: Install sshpass and rsync
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass rsync

    - name: Configure SSH
      run: |
        echo "Host mertalukas
          HostName ssh.mertalukas.cz
          User root
          ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_ID }} --service-token-secret ${{ secrets.CLOUDFLARE_SERVICE_TOKEN_SECRET }}
        " >> ~/.ssh/config

    - name: Deploy project files
      env:
        SSHPASS: ${{ secrets.SSH_PASSWORD }}
      run: |
        sshpass -e rsync -avz --delete ./ root@mertalukas:/var/www/html/private/git/filmino

    - name: Export Environment Variables
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_PORT_INT: ${{ secrets.DB_PORT_INT }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        NEXT_PUBLIC_BASE_API_URL: ${{ secrets.NEXT_PUBLIC_BASE_API_URL }}
        NEXT_PUBLIC_BASE_HOST_URL: ${{ secrets.NEXT_PUBLIC_BASE_HOST_URL }}
        PGADMIN_DEFAULT_EMAIL: ${{ secrets.PGADMIN_DEFAULT_EMAIL }}
        PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        TMDB_API_READ_KEY: ${{ secrets.TMDB_API_READ_KEY }}
      run: |
        echo DB_HOST=$DB_HOST >> ./app/.env
        echo DB_USER=$DB_USER >> ./app/.env
        echo DB_PASSWORD=$DB_PASSWORD >> ./app/.env
        echo DB_NAME=$DB_NAME >> ./app/.env
        echo DB_PORT=$DB_PORT >> ./app/.env
        echo DB_PORT_INT=$DB_PORT_INT >> ./app/.env
        echo GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID >> ./app/.env
        echo GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET >> ./app/.env
        echo NEXTAUTH_SECRET=$NEXTAUTH_SECRET >> ./app/.env
        echo NEXT_PUBLIC_BASE_API_URL=$NEXT_PUBLIC_BASE_API_URL >> ./app/.env
        echo NEXT_PUBLIC_BASE_HOST_URL=$NEXT_PUBLIC_BASE_HOST_URL >> ./app/.env
        echo PGADMIN_DEFAULT_EMAIL=$PGADMIN_DEFAULT_EMAIL >> ./app/.env
        echo PGADMIN_DEFAULT_PASSWORD=$PGADMIN_DEFAULT_PASSWORD >> ./app/.env
        echo TMDB_API_KEY=$TMDB_API_KEY >> ./app/.env
        echo TMDB_API_READ_KEY=$TMDB_API_READ_KEY >> ./app/.env

    - name: Run make up-prod
      env:
        SSHPASS: ${{ secrets.SSH_PASSWORD }}
      run: |
        sshpass -e ssh -o StrictHostKeyChecking=no root@mertalukas "
          cd /var/www/html/private/git/filmino && make up-prod
        "
