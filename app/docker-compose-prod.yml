services:
  filmino:
    container_name: filmino-app
    image: lmerta/filmino-app:latest
    platform: linux/arm64/v8
    ports:
      - "6050:5100"
    environment:
      - NODE_ENV=production
      - DB_URL_PRISMA=${DB_URL}
    env_file:
      - .env

  db:
    image: postgres:16
    platform: linux/arm64/v8
    container_name: filmino-db
    restart: always
    ports:
      - "6051:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: elestio/pgadmin
    platform: linux/arm64/v8
    container_name: filmino-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "6052:80"
    depends_on:
      - db

volumes:
  db_data:
